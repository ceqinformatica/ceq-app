# Compila el APK de la app en los servidores de GitHub (eas build --local),
# sin gastar el cupo mensual de compilaciones gratis de Expo. Expo solo
# aporta las credenciales (keystore) guardadas en la cuenta.
# El APK queda para descargar en Actions > la ejecución > Artifacts.
# Se ejecuta cada vez que se aprueba un cambio en main, o a mano desde
# la pestaña Actions ("Run workflow").
# Necesita el secreto EXPO_TOKEN en Settings > Secrets and variables > Actions.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil de eas.json (preview = APK para probar, production = AAB para Play Store, tiendas = APK firmado para Galaxy Store y AppGallery)"
        default: preview
        type: choice
        options: [preview, production, tiendas]

permissions:
  contents: read

concurrency:
  group: compilar-apk-${{ github.ref }}-${{ inputs.perfil || 'preview' }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar en GitHub
        env:
          PERFIL: ${{ inputs.perfil || 'preview' }}
        run: |
          perfil="$PERFIL"
          ext=apk; [ "$perfil" = production ] && ext=aab
          eas build --platform android --profile "$perfil" --local --non-interactive --output "ceq-$perfil.$ext"

      - uses: actions/upload-artifact@v4
        with:
          name: ceq-${{ inputs.perfil || 'preview' }}-${{ github.sha }}
          path: ceq-*.*
          retention-days: 30
          if-no-files-found: error
