# Revisa cada cambio antes de aprobarlo: tipos, pruebas de la lógica
# (firma y progreso) y pruebas de seguridad de la base de datos.
# No usa secretos ni toca el proyecto real de Supabase: la base se
# arma desde cero en un Postgres temporal de GitHub.
name: Verificar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipos y pruebas de la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  base:
    name: Seguridad de la base (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones dos veces y correr las pruebas
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stub_supabase.sql
          # Cada migración se aplica dos veces seguidas: comprueba que se
          # puede re-ejecutar sin pisar lo que dejan las siguientes.
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            case "$f" in *ajustes*|*notificaciones*|*tramites*|*recordatorios*|*recursar*|*carnet*|*recu_o_regu*|*firma_entera*|*periodo_firmadas*|*calendario*|*panel_admin*|*tipo_clase*|*fin_semestre*|*horarios_clases*) psql -v ON_ERROR_STOP=1 -q -f "$f";; esac
          done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/politicas.sql
